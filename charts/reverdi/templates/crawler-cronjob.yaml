{{/*
===========================================================================
크롤러 CronJob — 30분마다 당근·중고나라·번개장터 수집

🔴 반드시 배치 노드에만 떠야 한다.
   Chromium 이 메모리를 크게 쓰고 이미지가 3.59GB 라
   웹 노드에 뜨면 웹 응답이 흔들린다.
===========================================================================
*/}}
{{- if .Values.crawler.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "reverdi.fullname" . }}-crawler
  labels:
    {{- include "reverdi.labels" . | nindent 4 }}
    app.kubernetes.io/component: crawler
spec:
  schedule: {{ .Values.crawler.schedule | quote }}
  {{/* 이전 회차가 안 끝났으면 이번은 건너뛴다. 같은 매물을 두 번 긁지 않게. */}}
  concurrencyPolicy: {{ .Values.crawler.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.crawler.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.crawler.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "reverdi.labels" . | nindent 12 }}
            app.kubernetes.io/component: crawler
        spec:
          # 🔴 IRSA — 배치는 웹과 다른 역할을 쓴다 (크롤러는 S3 쓰기만)
          {{- if .Values.batchServiceAccountName }}
          serviceAccountName: {{ .Values.batchServiceAccountName }}
          {{- end }}
          restartPolicy: OnFailure
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.crawler.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.crawler.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{/*
            🔴 /dev/shm 확대. 컨테이너 기본은 64MB 인데 Chromium 은 그보다 많이 쓴다.
               없으면 페이지를 열다가 죽는다.
               docker-compose 의 shm_size: 1gb 에 해당한다.
               medium: Memory 는 tmpfs(메모리)를 쓴다는 뜻이라 디스크를 안 탄다.
          */}}
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: {{ .Values.crawler.shmSize }}
          containers:
            - name: crawler
              image: {{ include "reverdi.crawlerImage" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                {{- toYaml .Values.crawler.command | nindent 16 }}
              envFrom:
                {{- include "reverdi.envFromBatch" . | nindent 16 }}
              volumeMounts:
                - name: dshm
                  mountPath: /dev/shm
              resources:
                {{- toYaml .Values.crawler.resources | nindent 16 }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
{{- end }}
