{{/*
===========================================================================
DB 마이그레이션 Job — alembic upgrade head

Helm 훅으로 앱 파드보다 먼저 실행된다.
웹 파드 3개가 동시에 alembic 을 돌리면 경합하기 때문이다.

백엔드 이미지를 그대로 쓴다.
dockerfile.backend 에 alembic.ini 와 alembic/ 이 이미 들어 있다.
===========================================================================
*/}}
{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  {{/* 리비전을 붙여 업그레이드마다 새 Job 이 되게 한다 */}}
  name: {{ include "reverdi.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "reverdi.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    {{/* 음수일수록 먼저. 다른 훅이 생겨도 마이그레이션이 앞서게 -5 로 둔다 */}}
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "reverdi.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      {{- if .Values.batchServiceAccountName }}
      serviceAccountName: {{ .Values.batchServiceAccountName }}
      {{- end }}
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "reverdi.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          {{/*
            🔴 여기서 reverdi.envFrom 을 쓰지 않는다.

            이 Job 은 pre-install 훅이라 일반 리소스(ConfigMap)보다 먼저 실행된다.
            첫 설치 때는 ConfigMap 이 아직 없어서
              Error: configmap "reverdi-config" not found
            로 파드가 CreateContainerConfigError 에 빠진다.

            마이그레이션에 실제로 필요한 값은 DATABASE_URL 하나뿐이고,
            그건 Secret 에 있다(외부에서 미리 생성).
            LOG_LEVEL 같은 값은 config.py 에 전부 기본값이 있어 없어도 동작한다.

            그래서 Secret 만 필수로 걸고, ConfigMap 은 optional: true 로 둔다.
              첫 설치  → ConfigMap 없음 → 건너뜀 → 정상 동작
              업그레이드 → ConfigMap 있음 → 반영
          */}}
          envFrom:
            {{/*
              🔴 마이그레이션도 배치다 — alembic 은 app/auth.py 를 임포트하지 않아
                 관리자 비밀번호가 필요 없다. DATABASE_URL 만 있으면 된다.
            */}}
            - secretRef:
{{- if .Values.secretScope.perWorkload }}
                name: {{ .Values.secretScope.dbSecretName }}
{{- else }}
                name: {{ include "reverdi.secretName" . }}
{{- end }}
            - configMapRef:
                name: {{ include "reverdi.configMapName" . }}
                optional: true
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
{{- end }}
