# ===========================================================================
# reverdi 차트 기본값
#
# 이 파일이 모든 템플릿의 기준이다. 여기서 정한 키 이름을 templates/ 가 참조한다.
# 환경별 차이는 values-vagrant.yaml · values-aws.yaml 이 이 값을 덮어쓴다.
#
# 규칙
#   - 여기에는 "모든 환경 공통" 또는 "안전한 기본값"만 둔다
#   - 환경마다 다른 값(이미지 주소, Ingress 등)은 빈 값으로 두고 환경 파일에서 채운다
#   - 🔴 비밀값은 절대 넣지 않는다. 이 파일은 git 에 커밋된다
# ===========================================================================

# ---------------------------------------------------------------------------
# 이름 재정의 (보통 건드리지 않는다)
#
# 릴리스 이름이 리소스 이름의 기준이 된다.
#   helm install reverdi ./charts/reverdi  →  reverdi-web, reverdi-config ...
# 이름을 강제로 바꾸고 싶을 때만 아래를 채운다.
# ---------------------------------------------------------------------------
nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# 이미지
# ---------------------------------------------------------------------------
image:
  # 환경별로 반드시 덮어쓴다
  #   vagrant : 192.168.56.15:30500/reverdi-backend
  #   aws     : <계정>.dkr.ecr.ap-northeast-2.amazonaws.com/reverdi-backend
  repository: ""
  # Jenkins 가 커밋 해시 7자리로 갱신한다. 'latest' 를 쓰지 않는 이유는
  # 무엇이 떠 있는지 추적이 안 되고, pullPolicy 기본값이 Always 로 바뀌기 때문.
  tag: ""
  pullPolicy: IfNotPresent

# 크롤러는 별도 이미지(3.59GB, Chromium 포함)를 쓴다.
# repository 만 다르고 태그는 같은 커밋에서 나오므로 image.tag 를 공유한다.
crawlerImage:
  repository: ""

# 사설 레지스트리에 인증이 필요할 때만 사용 (Vagrant 는 insecure 라 불필요)
imagePullSecrets: []

# ---------------------------------------------------------------------------
# 웹 워크로드
# ---------------------------------------------------------------------------
replicaCount: 3

# 파드가 뜰 노드를 고른다. 노드에 label 을 걸어둔 상태여야 한다.
#   kubectl label node node1 workload=web
nodeSelector:
  workload: web

# 웹 파드는 taint 를 견딜 필요가 없다. 배치 노드로 가면 안 되기 때문.
tolerations: []

resources:
  # 🔴 requests 가 없으면 HPA 가 동작하지 않는다.
  #    HPA 는 "요청량 대비 사용량"으로 판단하는데 기준이 없어지기 때문.
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# 무중단 배포
strategy:
  maxSurge: 1
  # 🔴 0 이어야 새 파드가 Ready 된 뒤에 옛 파드를 지운다.
  #    1 이면 배포 중 용량이 줄어 요청이 끊길 수 있다.
  maxUnavailable: 0

# 종료 시 진행 중이던 요청을 마저 처리할 시간
terminationGracePeriodSeconds: 60
preStopSleepSeconds: 5

# AZ(노드) 분산
# 🔴 이걸 안 걸면 replicas 3 을 줘도 파드가 한 노드에 몰릴 수 있다.
#    그 노드가 죽으면 서비스가 전부 사라진다.
topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  # ScheduleAnyway = 분산이 안 되면 그래도 띄운다 (학습 단계에 안전)
  # DoNotSchedule  = 분산이 안 되면 Pending 으로 남긴다 (운영에 적합)
  whenUnsatisfiable: ScheduleAnyway

# 컨테이너 보안
# 이미지가 이미 uid 10001 비루트로 만들어져 있어(dockerfile.backend) 선언만 하면 된다.
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false   # 임시파일 쓰기가 있으면 false. 확인 후 true 로
  capabilities:
    drop: ["ALL"]

# ---------------------------------------------------------------------------
# 헬스체크
#
# 🔴 두 경로의 역할이 다르다. 바꿔 쓰면 장애가 커진다.
#    /health  프로세스만 확인. DB 를 보지 않는다
#             → livenessProbe 와 ALB 헬스체크에 쓴다
#    /ready   DB 와 마이그레이션까지 확인
#             → readinessProbe 에만 쓴다
#
#    liveness 에 /ready 를 쓰면 DB 가 잠깐 죽었을 때
#    파드 3개가 전부 재시작 루프에 빠진다. 60초 장애가 몇 분짜리 전면 정지가 된다.
# ---------------------------------------------------------------------------
probes:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# ---------------------------------------------------------------------------
# Service / 외부 진입
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 80
  # 컨테이너가 듣는 포트 (dockerfile.backend 의 EXPOSE 8000)
  targetPort: 8000

# Vagrant 는 ALB 가 없으므로 NodePort 로 외부에서 접속한다
nodeport:
  enabled: false
  port: 30080

# AWS 에서만 켠다. 켜면 AWS Load Balancer Controller 가 ALB 를 만든다
ingress:
  enabled: false
  className: alb
  host: ""
  certificateArn: ""
  annotations: {}

# ---------------------------------------------------------------------------
# 가용성
# ---------------------------------------------------------------------------
pdb:
  enabled: true
  # 노드 드레인 시 최소 몇 개를 남길지. replicas 3 에 2 면 한 번에 하나씩만 빠진다.
  minAvailable: 2

hpa:
  enabled: false          # Metrics Server 설치 후 켠다
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  # 비워두면(null) HPA 에서 메모리 지표를 아예 뺀다.
  # 메모리는 파이썬 앱에서 잘 안 내려가 축소가 막히는 경우가 있어 기본은 끈다.
  targetMemoryUtilizationPercentage: null

# ---------------------------------------------------------------------------
# 설정값 (ConfigMap 이 된다)
#
# 값은 전부 문자열로 쓴다. ConfigMap 의 data 는 문자열만 받는다.
# 숫자를 따옴표 없이 쓰면 Helm 이 렌더링할 때 오류가 난다.
#
# ⚠️ API_PREFIX 는 넣지 않는다.
#    config.py 에 API_PREFIX = "/api" 코드 상수로 박혀 있어 환경변수가 아니다.
#    ConfigMap 에 넣어도 앱이 읽지 않는다.
# ---------------------------------------------------------------------------
config:
  # 로그 — config.py 기본값은 text. 운영에서는 json 이 파싱하기 좋다
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"

  # 크롤링 주기 — CronJob 이 따로 돌리므로 웹 파드에서는 꺼야 한다
  # 🔴 config.py 기본값이 True 라 명시적으로 false 를 넣어야 한다
  ENABLE_CRAWLER: "false"
  CRAWL_INTERVAL_MINUTES: "30"
  CRAWL_RETRY_MINUTES: "5"
  CRAWL_RUN_TIMEOUT_MINUTES: "60"
  JOONGNA_PAGES_PER_BRAND: "3"
  BUNJANG_PAGES_PER_JOB: "3"

  # 몇 번 연속 미발견이면 매물을 비활성 처리할지
  MISSING_THRESHOLD: "3"

  # 업로드 상한 5MB. nginx 를 뺐으므로 앱이 유일한 방어선이다
  MAX_UPLOAD_BYTES: "5242880"

  # 로그인 유지 12시간
  SESSION_MAX_AGE_SECONDS: "43200"

  # 🔴 비워둔다. 비어 있으면 CORS 미들웨어를 아예 붙이지 않는다.
  #    FastAPI 가 프론트를 같은 출처로 서빙하므로 필요 없다.
  ALLOWED_ORIGINS: ""

  # -------------------------------------------------------------------------
  # 아래는 저장소 최신 반영분 (2026-09-02 커밋)
  # -------------------------------------------------------------------------

  # 🔴 운영 판별 스위치. "production" 이면 config.py 가 기동 가드를 켠다.
  #    SESSION_SECRET · 계정 비밀번호 · S3 설정이 비어 있으면 RuntimeError 로
  #    프로세스가 임포트 단계에서 죽는다. 쿠버네티스는 그걸 CrashLoopBackOff 로 보여준다.
  #    values-vagrant 는 "local", values-aws 는 "production" 으로 덮어쓴다.
  APP_ENV: "local"

  # 세션 쿠키에 Secure 플래그. 기본값은 IS_PRODUCTION 을 따라간다.
  # ⚠️ ALB 가 TLS 를 종료하고 뒤는 HTTP 라, 앱이 스스로 판단하면 항상 http 로 보인다.
  #    그래서 환경변수로 명시한다. (uvicorn 은 --proxy-headers 로 이미 뜬다)
  COOKIE_SECURE: "false"

  # 업로드 파일 경로. 로컬 저장소 모드일 때만 쓰인다.
  UPLOAD_DIR: "/srv/uploads"

  # 쓰기 질의 타임아웃(초)
  WRITE_TIMEOUT_SECONDS: "15"
  # 읽기 복제본이 실패했을 때 writer 로 폴백하고 이 시간 동안은 재시도하지 않는다
  READ_FALLBACK_COOLDOWN_SECONDS: "30"

  # 실시간 검색 (같은 검색어 재요청 쿨다운 · 페이지 수 · 타임아웃)
  LIVE_SEARCH_COOLDOWN_SECONDS: "120"
  LIVE_SEARCH_MAX_PAGES: "1"
  LIVE_SEARCH_TIMEOUT_SECONDS: "8"

  # 시연용 판매자 계정 연결. 0 이면 연결하지 않는다.
  CLIENT_SELLER_ID: "0"

  # -------------------------------------------------------------------------
  # 저장소 (app/domain/storage.py)
  #
  # 🔴 APP_ENV=production 이면 S3_BUCKET 이 비어 있을 때 기동을 거부한다.
  #    단일 호스트 시연이라 로컬 디스크를 쓰려면 ALLOW_LOCAL_STORAGE=true 를 준다.
  # -------------------------------------------------------------------------
  S3_BUCKET: ""
  AWS_REGION: ""
  # 화면이 참조할 공개 주소 앞부분. 비우면 버킷 주소로 만든다.
  # CloudFront 를 붙이면 그 도메인을 넣는다.
  S3_PUBLIC_BASE: ""
  # 로컬(Vagrant)은 S3 가 없으므로 true. AWS 에서는 false 로 두어 S3 를 강제한다.
  ALLOW_LOCAL_STORAGE: "true"

  # -------------------------------------------------------------------------
  # 속도 제한 (2026-09-03 백엔드 보안 업데이트)
  #
  # ⚠️ 이 제한은 파드 하나가 자기 메모리로 센다 (app/ratelimit.py).
  #    파드가 3개면 상한이 사실상 3배로 느슨해지고, 파드가 재시작되면 초기화된다.
  #    백엔드 주석도 그걸 인정한다 — "무제한과 분당 30회는 전혀 다른 상태"
  #    파드를 가로지르는 제한은 AWS WAF rate-based rule 몫이다.
  # -------------------------------------------------------------------------

  # 같은 IP 가 5번 틀리면 300초 잠근다
  LOGIN_MAX_FAILURES: "5"
  LOGIN_LOCKOUT_SECONDS: "300"

  # 실시간 검색 — 검색어를 바꿔가며 외부 사이트를 계속 두드리는 것을 막는다
  LIVE_SEARCH_RATE_LIMIT: "10"
  LIVE_SEARCH_RATE_WINDOW_SECONDS: "60"

  # 클릭 이벤트
  CLICK_RATE_LIMIT: "60"
  CLICK_RATE_WINDOW_SECONDS: "60"
  # 새 세션 쿠키 발급 상한 — 쿠키를 버려가며 중복 제한을 피하는 것을 막는다
  CLICK_NEW_SESSION_LIMIT: "30"
  CLICK_NEW_SESSION_WINDOW_SECONDS: "3600"

  # -------------------------------------------------------------------------
  # 🔴 ALB 뒤에서 클라이언트 IP 를 어떻게 볼지
  #
  #    ALB 뒤에서는 request.client.host 가 전부 ALB 의 IP 다.
  #    그것으로 세면 모든 사용자가 한 사람으로 묶여
  #    첫 사용자가 상한을 채우면 전원이 막힌다.
  #
  #    반대로 프록시가 없는데 켜면, 누구나 헤더에 아무 IP 나 적어
  #    제한을 피할 수 있다. → 환경별로 반드시 다르게 준다.
  # -------------------------------------------------------------------------
  TRUST_PROXY_HEADERS: "false"

  # -------------------------------------------------------------------------
  # 🔴 DB 연결 암호화
  #
  #    기본값 prefer 는 "되면 쓰고 안 되면 평문" 이다.
  #    앱은 운영에서 prefer 면 경고만 남기고 기동한다 — 우리가 값을 줘야 한다.
  #
  #    disable < allow < prefer < require < verify-ca < verify-full
  #                              ↑ 여기부터 TLS 강제
  #
  #    verify-full 을 쓰려면 RDS 루트 CA 번들을 파드에 마운트하고
  #    DATABASE_SSL_ROOT_CERT 에 그 경로를 준다.
  # -------------------------------------------------------------------------
  DATABASE_SSL_MODE: "prefer"
  DATABASE_SSL_ROOT_CERT: ""

# ---------------------------------------------------------------------------
# 비밀값 (Secret)
#
# 🔴 값은 여기 쓰지 않는다. 이 파일은 git 에 커밋된다.
#
# Vagrant : 아래 명령으로 미리 만들고 create: false 로 둔다
#   kubectl create secret generic reverdi-secret -n reverdi \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://...' \
#     --from-literal=DATABASE_RO_URL='postgresql+asyncpg://...' \
#     --from-literal=SESSION_SECRET="$(python3 -c 'import secrets;print(secrets.token_hex(32))')" \
#     --from-literal=ADMIN_USERNAME=admin --from-literal=ADMIN_PASSWORD='...' \
#     --from-literal=CLIENT_USERNAME=client --from-literal=CLIENT_PASSWORD='...'
#
# AWS : External Secrets Operator 가 Secrets Manager 에서 만든다
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# 🔴 비밀값 범위 분리 (백엔드 보안 점검 4번)
#
#   perWorkload: false  전 워크로드가 같은 Secret (기존 동작)
#   perWorkload: true   배치는 DB 접속만 받는다
#
# ⚠️ true 로 켜기 전에 — 백엔드 4번 패치가 들어간 이미지여야 한다.
#    이전 이미지는 크롤러가 관리자 비밀번호 없이 뜨지 않는다.
#
#    확인:
#      kubectl exec -n reverdi deploy/reverdi-web -- \
#        python -c "from app.config import require_secrets; print('ok')"
#
# 켤 때 만들어야 할 Secret:
#      kubectl create secret generic reverdi-db-secret -n reverdi \
#        --from-literal=DATABASE_URL="$(kubectl get secret reverdi-secret -n reverdi \
#           -o jsonpath='{.data.DATABASE_URL}' | base64 -d)" \
#        --from-literal=DATABASE_RO_URL="$(kubectl get secret reverdi-secret -n reverdi \
#           -o jsonpath='{.data.DATABASE_RO_URL}' | base64 -d)"
# ---------------------------------------------------------------------------
secretScope:
  perWorkload: false
  dbSecretName: reverdi-db-secret

secret:
  # true 로 두면 차트가 Secret 을 만든다. 로컬 임시 테스트용이며 값이 git 에 남는다.
  create: false
  # 차트가 참조할 Secret 이름
  name: reverdi-secret
  # create: true 일 때만 쓰인다.
  # 🔴 여기에 실제 비밀번호를 넣고 커밋하지 말 것.
  #    값을 넣어야 한다면 --set 이나 별도 파일(-f)로 넘기고 그 파일은 .gitignore 에.
  data: {}

# ---------------------------------------------------------------------------
# 크롤러 CronJob (담당: B)
# ---------------------------------------------------------------------------
crawler:
  enabled: true
  schedule: "*/30 * * * *"
  # 🔴 실제 진입점. README 248행 "python -m app.crawler" 기준.
  #    app/crawler/__main__.py 가 존재한다. crawler.main 같은 모듈은 없다.
  #    --once 는 한 번 수집하고 종료 (CronJob 이 스케줄을 담당하므로)
  command: ["python", "-m", "app.crawler", "--once"]
  # 이전 실행이 안 끝났으면 이번 회차를 건너뛴다
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # 🔴 컨테이너 기본 /dev/shm 은 64MB. Chromium 이 페이지를 열다 죽는다.
  #    docker-compose 의 shm_size: 1gb 에 해당한다.
  shmSize: 1Gi
  nodeSelector:
    workload: batch
  tolerations:
    - key: workload
      value: batch
      effect: NoSchedule
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi

# ---------------------------------------------------------------------------
# 집계 CronJob (담당: B)
# ⚠️ 앱에 클릭 집계 코드가 아직 없다. 진입점이 생긴 뒤 enabled: true 로 바꾼다.
# ---------------------------------------------------------------------------
aggregate:
  # 🔴 false 로 둔다. app/aggregate 모듈이 아직 없다(백엔드 수정요청 6번).
  #    진입점이 생긴 뒤 true 로 바꾼다.
  enabled: false
  schedule: "*/10 * * * *"
  command: ["python", "-m", "app.aggregate", "--once"]
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  nodeSelector:
    workload: batch
  tolerations:
    - key: workload
      value: batch
      effect: NoSchedule
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ---------------------------------------------------------------------------
# pg_dump 백업 CronJob (담당: B)
# ⚠️ 진입점이 아직 없다.
# ---------------------------------------------------------------------------
pgdump:
  # 🔴 false 로 둔다. 백업 결과를 어디에 둘지(MinIO/S3)가 정해져야 한다.
  #    /backup 볼륨만 마운트하면 파드가 죽을 때 같이 사라진다.
  enabled: false
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  # ⚠️ pg_dump 는 서버보다 버전이 낮으면 실패한다. RDS 가 PostgreSQL 17 이므로 17 로 맞춘다.
  image: postgres:17-alpine
  nodeSelector:
    workload: batch
  tolerations:
    - key: workload
      value: batch
      effect: NoSchedule
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # 임시 저장 경로. 여기에 덤프를 만든 뒤 오브젝트 스토리지로 올린다.
  workDir: /backup

# ---------------------------------------------------------------------------
# 마이그레이션 Job (담당: B)
#
# 백엔드 이미지를 그대로 쓴다. dockerfile.backend 에 alembic.ini 와 alembic/ 이
# 이미 들어 있어 별도 이미지가 필요 없다.
#
# Helm 훅(pre-install, pre-upgrade)으로 앱 파드보다 먼저 실행된다.
# 웹 파드 3개가 동시에 alembic 을 돌리면 경합하기 때문.
# ---------------------------------------------------------------------------
migrate:
  enabled: true
  backoffLimit: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ---------------------------------------------------------------------------
# 🔴 IRSA — 파드별 IAM 역할 (AWS 전용)
#
#   비우면 default ServiceAccount 를 쓰고, 파드가 "노드"의 IAM 역할로 AWS 에 붙는다.
#   그러면 웹·크롤러가 같은 권한을 갖게 되고, S3 정책이 파드 단위로 안 걸린다.
#
#   로컬(Vagrant)에는 IRSA 라는 개념이 없으므로 비워둔다.
#   AWS 에서는 eksctl(aws/cluster.yaml)이 만든 SA 이름을 넣는다.
# ---------------------------------------------------------------------------
serviceAccountName: ""
batchServiceAccountName: ""
