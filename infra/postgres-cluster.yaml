# ---------------------------------------------------------------------------
# infra/postgres-cluster.yaml — PostgreSQL 고가용성 (CloudNativePG)
#
# 왜 이렇게 하나
#   AWS 에서는 RDS Multi-AZ 를 쓴다. 로컬에는 그런 관리형 서비스가 없으므로
#   CloudNativePG 오퍼레이터로 같은 모양을 만든다.
#
#   CNPG 가 만드는 접속 주소가 RDS 와 형태가 같다.
#     로컬  reverdi-db-rw (쓰기) / reverdi-db-ro (읽기)
#     AWS   ...-primary  (쓰기)     / ...-ro  (읽기)
#   그래서 여기서 검증한 앱의 읽기/쓰기 분리가 AWS 에서 그대로 통한다.
#
# 🔴 적용 순서가 중요하다 — 실제로 겪은 문제다 (문제 12)
#    "Secret 을 먼저 만들고 DB 를 만든다" 로 하면 인증에 실패한다.
#    CNPG 가 초기화할 때 Secret 을 새로 만들어 덮어쓰기 때문이다.
#
#      ① kubectl apply -f infra/postgres-cluster.yaml
#      ② kubectl get cluster -n reverdi      # healthy 대기
#      ③ PW=$(kubectl get secret reverdi-db-app -n reverdi \
#             -o jsonpath='{.data.password}' | base64 -d)
#      ④ 그 PW 로 앱 Secret 생성
#
# AWS 로 가면 이 파일은 버려지고 RDS Multi-AZ 로 대체된다.
# 다만 그것으로 검증한 앱 설정과 페일오버 감각은 남는다.
# ---------------------------------------------------------------------------
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: reverdi-db
  namespace: reverdi
spec:
  # primary 1 + replica 2. node1~3 에 하나씩 뜬다.
  instances: 3

  # 🔴 AWS RDS PG17 과 맞춘다.
  #    로컬 16 / AWS 17 로 갈리면 마이그레이션이나 pg_dump 에서
  #    환경별로 다른 문제가 난다.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2

  # 페일오버 시 오퍼레이터가 알아서 승격시킨다
  primaryUpdateStrategy: unsupervised

  storage:
    size: 10Gi
    storageClass: local-path

  bootstrap:
    initdb:
      database: reverdi
      owner: reverdi
      # 🔴 secret 을 여기 명시하지 않는다.
      #    명시하면 "이미 있는 것을 쓰겠다"는 뜻이 되는데,
      #    CNPG 는 초기화 시점에 어차피 새로 만들어 덮어쓴다.
      #    비밀번호는 위 ③번 명령으로 꺼내 쓴다.

  affinity:
    nodeSelector:
      workload: web
    # 🔴 primary 와 replica 가 다른 노드에 뜨게 한다.
    #    같은 노드에 몰리면 그 노드가 죽을 때 전부 사라져 페일오버가 의미 없다.
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
